# ===================================================================
# Railway Analytics and Passenger Demand Forecasting Configuration
# ===================================================================

server.port=8080
spring.application.name=railway-spark-analytics

# Primary MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/railway_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# File Upload Settings for Large Dataset Ingestion
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Dataset Initial Path
railway.data.initial-path=railway_passenger_data.csv

# Logging Configuration
logging.level.root=INFO
logging.level.com.railway=INFO
logging.level.org.apache.spark=WARN
logging.level.org.sparkproject=WARN
logging.level.org.apache.hadoop=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
